name: Build arbitrary branch (manual from main)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check out and build (e.g. feature/macos-theme-frosted-minimize)'
        required: false
        default: 'feature/macos-theme-frosted-minimize'
      buildFlavor:
        description: 'Build flavor to assemble (e.g. FreeDebug or FreeRelease)'
        required: false
        default: 'FreeDebug'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build selected branch + flavor

    steps:
      - name: Checkout target branch (full fetch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Diagnostic - show branch and root files
        run: |
          echo "Git branch:"
          git rev-parse --abbrev-ref HEAD || true
          echo "Latest commit:"
          git --no-pager log -1 --oneline || true
          echo "Top-level file list (ls -la):"
          ls -la || true
          echo "Find gradle-related files (for debugging):"
          find . -maxdepth 6 -type f \( -name "*.gradle*" -o -name "gradle-wrapper.properties" -o -name "settings.gradle*" -o -name "gradlew" \) -print || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          build-tools: '34.0.0'
          components: |
            platform-tools
            cmdline-tools

      - name: Ensure Gradle wrapper exists (generate if missing) and run build
        env:
          FLAVOR_INPUT: ${{ github.event.inputs.buildFlavor }}
        run: |
          set -euo pipefail
          INPUT="${FLAVOR_INPUT:-FreeDebug}"
          TASK="assemble${INPUT}"
          echo "Target Gradle task: $TASK"

          # Find the project directory containing build.gradle(.kts) or settings.gradle(.kts)
          PROJECT_DIR=$(find . -maxdepth 5 -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf '%h\n' | sort -u | head -n 1 || true)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find a directory containing build.gradle or settings.gradle in the checked-out branch."
            echo "Listing repo for debugging:"
            ls -la
            find . -maxdepth 6 -type f -print
            exit 3
          fi

          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # If gradlew exists in that directory, use it. Otherwise try to generate it.
          if [ -f "./gradlew" ]; then
            echo "Found existing gradlew in $PROJECT_DIR"
            chmod +x ./gradlew || true
          else
            echo "Gradle wrapper not found. Installing system Gradle and generating wrapper..."
            sudo apt-get update -qq
            sudo apt-get install -y gradle || true
            # generate the wrapper; tolerate failure but exit if wrapper still missing
            gradle wrapper || true
            if [ -f "./gradlew" ]; then
              echo "Gradle wrapper generated successfully."
              chmod +x ./gradlew || true
            else
              echo "ERROR: Failed to generate gradlew. Listing $PROJECT_DIR contents:"
              ls -la
              exit 4
            fi
          fi

          # Run the wrapper
          echo "Running wrapper: ./gradlew $TASK from $(pwd)"
          ./gradlew "$TASK" --no-daemon --stacktrace

      - name: Create dummy keystore (for signing test builds)
        if: always()
        run: |
          mkdir -p app/keystore
          if [ ! -f app/keystore/release.jks ]; then
            keytool -genkeypair -v \
              -keystore app/keystore/release.jks \
              -storepass changeit \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Dummy, OU=Dev, O=Example, L=City, S=State, C=US" \
              -storetype JKS || true
          else
            echo "Keystore already exists, skipping generation."
          fi

      - name: Upload APK/AAB artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            app/build/outputs/**/*.apk
            app/build/outputs/**/*.aab
