name: Build arbitrary branch (manual from main)

# Ensure actions have permission to read repository contents
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check out and build (e.g. feature/macos-theme-frosted-minimize)'
        required: false
        default: 'feature/macos-theme-frosted-minimize'
      buildFlavor:
        description: 'Build flavor to assemble (e.g. FreeDebug or FreeRelease)'
        required: false
        default: 'FreeDebug'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build selected branch + flavor

    steps:
      - name: Checkout target branch (full fetch)
        uses: actions/checkout@v4
        with:
          # Ensure we fetch all refs and tags so we can checkout any branch
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Diagnostic - show branch and root files
        run: |
          echo "Git branch:"
          git rev-parse --abbrev-ref HEAD || true
          echo "Latest commit:"
          git --no-pager log -1 --oneline || true
          echo "Top-level file list (ls -la):"
          ls -la || true
          echo "Find gradle files (for debugging):"
          find . -maxdepth 4 -type f \( -name "*.gradle*" -o -name "gradle-wrapper.properties" -o -name "settings.gradle*" \) -print || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: google-github-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: '34.0.0'
          components: |
            platform-tools
            cmdline-tools

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create dummy keystore (for signing test builds)
        run: |
          mkdir -p app/keystore
          keytool -genkeypair -v \
            -keystore app/keystore/release.jks \
            -storepass changeit \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Dummy, OU=Dev, O=Example, L=City, S=State, C=US" \
            -storetype JKS || true

      - name: Build selected flavor
        env:
          FLAVOR_INPUT: ${{ github.event.inputs.buildFlavor }}
        run: |
          INPUT="${FLAVOR_INPUT:-FreeDebug}"
          TASK="assemble${INPUT}"
          echo "Running Gradle task: $TASK"
          ./gradlew "$TASK" --no-daemon --stacktrace

      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            app/build/outputs/**/*.apk
            app/build/outputs/**/*.aab
