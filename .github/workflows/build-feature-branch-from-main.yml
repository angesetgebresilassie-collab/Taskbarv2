name: Build arbitrary branch (manual from main)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check out and build (e.g. feature/macos-theme-frosted-minimize)'
        required: false
        default: 'feature/macos-theme-frosted-minimize'
      buildFlavor:
        description: 'Build flavor to assemble (e.g. FreeDebug or FreeRelease)'
        required: false
        default: 'FreeDebug'
      gradleVersion:
        description: 'Gradle version to use for generating wrapper if missing (e.g. 8.5.1)'
        required: false
        default: '8.5.1'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build selected branch + flavor

    steps:
      - name: Checkout target branch (full fetch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Diagnostic - show branch and root files
        run: |
          echo "Checked-out branch: $(git rev-parse --abbrev-ref HEAD || true)"
          echo "Latest commit:"
          git --no-pager log -1 --oneline || true
          echo "Top-level file list:"
          ls -la || true
          echo "Find gradle-related files (for debugging):"
          find . -maxdepth 6 -type f \( -name "*.gradle*" -o -name "gradle-wrapper.properties" -o -name "settings.gradle*" -o -name "gradlew" \) -print || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          build-tools: '34.0.0'
          components: |
            platform-tools
            cmdline-tools

      - name: Ensure tools for bootstrap (unzip, wget)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip wget

      - name: Ensure Gradle wrapper exists (generate if missing) and run build
        env:
          FLAVOR_INPUT: ${{ github.event.inputs.buildFlavor }}
          GRADLE_VERSION: ${{ github.event.inputs.gradleVersion }}
        run: |
          set -euo pipefail
          FLAVOR="${FLAVOR_INPUT:-FreeDebug}"
          FLAVOR="${FLAVOR// /}"
          TASK="assemble${FLAVOR}"
          echo "Target Gradle task: $TASK"

          PROJECT_DIR=$(find . -maxdepth 5 -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf '%h\n' | sort -u | head -n 1 || true)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find build.gradle or settings.gradle in the checked-out branch."
            echo "Listing repo for debugging:"
            ls -la
            find . -maxdepth 6 -type f -print
            exit 3
          fi

          echo "Project directory detected: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          mkdir -p app/keystore || true
          if [ ! -f app/keystore/release.jks ]; then
            echo "Creating dummy keystore at app/keystore/release.jks (testing only)"
            keytool -genkeypair -v \
              -keystore app/keystore/release.jks \
              -storepass changeit \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Dummy, OU=Dev, O=Example, L=City, S=State, C=US" \
              -storetype JKS || true
          else
            echo "Keystore already present; skipping generation."
          fi

          if [ -f "./gradlew" ]; then
            echo "Using existing gradlew in $PROJECT_DIR"
            chmod +x ./gradlew || true
          else
            echo "gradlew not found. Downloading Gradle ${GRADLE_VERSION} and generating wrapper..."
            DIST_URL="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            echo "Downloading $DIST_URL"
            wget -q -O /tmp/gradle.zip "$DIST_URL"
            unzip -q /tmp/gradle.zip -d /tmp
            GRADLE_BIN="/tmp/gradle-${GRADLE_VERSION}/bin/gradle"
            if [ ! -x "$GRADLE_BIN" ]; then
              echo "ERROR: downloaded Gradle binary not found at $GRADLE_BIN"
              ls -la /tmp
              exit 4
            fi
            echo "Generating wrapper with $GRADLE_BIN"
            "$GRADLE_BIN" wrapper || true
            if [ -f "./gradlew" ]; then
              chmod +x ./gradlew || true
              echo "Wrapper generated successfully."
            else
              echo "ERROR: gradlew generation failed. Directory listing:"
              ls -la
              exit 5
            fi
          fi

          echo "Running wrapper: ./gradlew $TASK from $(pwd)"
          ./gradlew "$TASK" --no-daemon --stacktrace

      - name: Upload APK/AAB artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            app/build/outputs/**/*.apk
            app/build/outputs/**/*.aab              
