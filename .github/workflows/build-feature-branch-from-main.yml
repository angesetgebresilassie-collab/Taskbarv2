name: Build arbitrary branch (manual from main)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check out and build (e.g. feature/macos-theme-frosted-minimize)'
        required: false
        default: 'feature/macos-theme-frosted-minimize'
      buildFlavor:
        description: 'Build flavor to assemble (e.g. FreeDebug or FreeRelease)'
        required: false
        default: 'FreeDebug'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build selected branch + flavor

    steps:
      - name: Checkout target branch (full fetch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Diagnostic - show branch and root files
        run: |
          echo "Git branch:"
          git rev-parse --abbrev-ref HEAD || true
          echo "Latest commit:"
          git --no-pager log -1 --oneline || true
          echo "Top-level file list (ls -la):"
          ls -la || true
          echo "Find gradle files (for debugging):"
          find . -maxdepth 6 -type f \( -name "*.gradle*" -o -name "gradle-wrapper.properties" -o -name "settings.gradle*" -o -name "gradlew" \) -print || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          build-tools: '34.0.0'
          components: |
            platform-tools
            cmdline-tools

      - name: Make gradlew executable and build (search for wrapper)
        env:
          FLAVOR_INPUT: ${{ github.event.inputs.buildFlavor }}
        run: |
          INPUT="${FLAVOR_INPUT:-FreeDebug}"
          TASK="assemble${INPUT}"
          echo "Will attempt to run Gradle task: $TASK"

          # find gradlew anywhere in repo (limit depth to avoid long searches)
          GRADLEW_PATH=$(find . -maxdepth 6 -type f -name gradlew -print -quit || true)

          if [ -n "$GRADLEW_PATH" ]; then
            echo "Found gradlew at: $GRADLEW_PATH"
            chmod +x "$GRADLEW_PATH" || true
            WRAPPER_DIR=$(dirname "$GRADLEW_PATH")
            echo "Changing to wrapper directory: $WRAPPER_DIR"
            pushd "$WRAPPER_DIR" || exit 1
            echo "Running ./gradlew $TASK in $(pwd)"
            ./gradlew "$TASK" --no-daemon --stacktrace
            POP_RET=$?
            popd
            exit $POP_RET
          else
            echo "ERROR: gradlew not found in repository. Listing repo for debugging:"
            ls -la
            find . -maxdepth 6 -type f -print
            echo "Please make sure the Gradle wrapper (gradlew and gradle/wrapper) are committed to the branch you're building."
            exit 2
          fi

      - name: Create dummy keystore (for signing test builds)
        if: always()
        run: |
          # create keystore in case release signing is needed later (no-op if already present)
          mkdir -p app/keystore
          if [ ! -f app/keystore/release.jks ]; then
            keytool -genkeypair -v \
              -keystore app/keystore/release.jks \
              -storepass changeit \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Dummy, OU=Dev, O=Example, L=City, S=State, C=US" \
              -storetype JKS || true
          else
            echo "Keystore already exists, skipping generation."
          fi

      - name: Upload APK/AAB artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            app/build/outputs/**/*.apk
            app/build/outputs/**/*.aab
